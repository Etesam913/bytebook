name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Parallel Code Quality, Linters, Dead Code & Unit Tests
  # ------------------------------------------------------------------
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/go-tools/bin
      GOTESTSUM_VERSION: v1.13.0
      DEADCODE_VERSION: v0.38.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Wails environment
        uses: ./.github/actions/setup-wails
        with:
          generate-bindings: "true"

      - name: Add Go tools to PATH
        run: |
          mkdir -p "${GOBIN}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Cache Go tools
        uses: actions/cache@v5
        id: go-tools-cache
        with:
          path: ${{ env.GOBIN }}
          key: ${{ runner.os }}-go-tools-v1-${{ env.GOTESTSUM_VERSION }}-${{ env.DEADCODE_VERSION }}

      - name: Install gotestsum & deadcode
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        run: |
          go install gotest.tools/gotestsum@${GOTESTSUM_VERSION}
          go install golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}

      - name: Run all checks in parallel
        run: bun check:ci

  # ------------------------------------------------------------------
  # JOB 4: Playwright Tests
  # ------------------------------------------------------------------
  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Uses the custom action from File 1
      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Wails environment
        uses: ./.github/actions/setup-wails
        with:
          generate-bindings: "true"

      # Cache Playwright Browsers specifically
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/bun.lock') }}

      # Only download browsers if the cache was NOT found
      - name: Install Playwright Browsers
        working-directory: ./frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./frontend
        run: bun run test:e2e:ci

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  # ------------------------------------------------------------------
  # JOB 5: Bundle Size Check
  # ------------------------------------------------------------------
  bundle-size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Wails environment
        uses: ./.github/actions/setup-wails
        with:
          generate-bindings: "true"

      - name: Build for production
        working-directory: ./frontend
        run: bun run build:ci

      - name: Check bundle size
        working-directory: ./frontend
        run: bun run size
