name: "Setup Wails"
description: "Install Linux dependencies, set up Go and Wails v3, fix the local replace directive, and optionally generate bindings"
inputs:
  generate-bindings:
    description: "Generate Wails bindings and frontend event names"
    required: false
    default: "false"
  wails-version:
    description: "Wails v3 tag to clone for the local replace directive"
    required: false
    default: "v3.0.0-beta.9"

runs:
  using: "composite"
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev libglib2.0-dev libsoup-3.0-dev libzmq3-dev

    - name: Setup Go
      id: go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Setup Wails v3 Source
      shell: bash
      run: |
        git clone --depth 1 --branch "${{ inputs.wails-version }}" https://github.com/wailsapp/wails.git

    - name: Cache Wails CLI
      id: wails-cli-cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.cache/wails-cli
        key: ${{ runner.os }}-${{ runner.arch }}-wails-cli-v1-${{ inputs.wails-version }}-go-${{ steps.go.outputs.go-version }}

    - name: Install Wails CLI
      if: steps.wails-cli-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: wails/v3/cmd/wails3
      run: GOBIN="${GITHUB_WORKSPACE}/.cache/wails-cli" go install

    - name: Add Wails CLI to PATH
      shell: bash
      run: |
        wails_bin_dir="${GITHUB_WORKSPACE}/.cache/wails-cli"
        echo "$wails_bin_dir" >> "$GITHUB_PATH"

    - name: Fix Wails replace directive
      shell: bash
      run: |
        sed -i 's|replace github.com/wailsapp/wails/v3 => ../wails/v3|replace github.com/wailsapp/wails/v3 => ./wails/v3|g' go.mod
        go mod tidy

    - name: Generate Wails bindings
      if: ${{ inputs.generate-bindings == 'true' }}
      shell: bash
      run: |
        wails3 generate bindings ./internal/...
        go run ./scripts/generate-events
