version: "3"

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    generates:
      - go.sum
    sources:
      - go.mod
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - bun.lock
    generates:
      - node_modules/*
    preconditions:
      - sh: bun --version
        msg: "Looks like bun isn't installed."
    cmds:
      - bun install

  build:frontend:
    summary: Prepare frontend assets for the application build
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - task: '{{if eq .DEV "true"}}prepare:frontend:dev{{else}}build:frontend:production{{end}}'

  prepare:frontend:dev:
    summary: Ensure go:embed has an asset while Vite serves the frontend
    dir: frontend
    status:
      - test -f dist/index.html
    cmds:
      - mkdir -p dist
      - 'printf "%s\n" "<!doctype html><title>Bytebook</title>" > dist/index.html'

  build:frontend:production:
    summary: Build the frontend project
    dir: frontend
    sources:
      - "src/**/*"
      - "public/**/*"
      - "bindings/**/*"
      - "patches/**/*"
      - index.html
      - package.json
      - bun.lock
      - tsconfig.json
      - vite.config.ts
      - ".env"
      - ".env.*"
    generates:
      - dist/*
    cmds:
      - bun run build:prod

  generate:bindings:
    summary: Generates bindings for the frontend
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "frontend/bindings/**/*"
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}'{{if .UseTypescript}} -ts{{end}} ./internal/...
      - go run ./scripts/generate-events

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` files from an image
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "icons.icns"
      - "icons.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icons.ico

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - bun run dev:internal -- --force --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
